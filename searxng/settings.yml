# Local SearXNG for the research chat: JSON API on 127.0.0.1:8888, no rate limiter (single user, loopback only).
# The secret key comes from SEARXNG_SECRET (/etc/research/research.env).
use_default_settings: true
general:
  instance_name: research
search:
  safe_search: 0
  formats: [html, json]
server:
  limiter: false
  image_proxy: false
  public_instance: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
