<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- subtle circuit lines -->
  <g stroke="#93c5fd" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 80 H70 L85 65 H110"/>
    <path d="M40 176 H64 L78 190 H104"/>
    <path d="M216 72 H190 L176 86 H160"/>
    <path d="M216 184 H196 L182 170 H162"/>
    <circle cx="40" cy="80" r="4" fill="#93c5fd"/>
    <circle cx="40" cy="176" r="4" fill="#93c5fd"/>
    <circle cx="216" cy="72" r="4" fill="#93c5fd"/>
    <circle cx="216" cy="184" r="4" fill="#93c5fd"/>
  </g>
  <!-- chat bubble -->
  <path d="M74 60 h108 a26 26 0 0 1 26 26 v62 a26 26 0 0 1 -26 26 h-52 l-34 30 v-30 h-22 a26 26 0 0 1 -26 -26 v-62 a26 26 0 0 1 26 -26 z"
        fill="url(#bubble)" fill-opacity="0.95"/>
  <!-- bolt -->
  <path d="M140 72 L104 136 H132 L120 184 L160 116 H132 L148 72 Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
