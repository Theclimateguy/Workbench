<!doctype html>
<html lang="ru" data-ui="v2" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" href="/static/icons/icon-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="/static/icons/icon-48.png?v=4" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=4">
<meta name="theme-color" content="#04070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="/static/lib/marked.umd.js"></script>
<style>
  /* ---- Workbench UI v2 (docs/ui-v2-plan.md): neutral surfaces, colour only for status; light + dark ---- */
  :root { --bg:#F3F4F6; --surf:#FFFFFF; --surf2:#F8FAFC; --bd:#E5E7EB; --bd2:#CBD5E1; --tx:#0F172A; --tx2:#475569; --tx3:#94A3B8;
          --acc:#2563EB; --accS:#DBEAFE; --ok:#15803D; --okS:#DCFCE7; --warn:#B45309; --warnS:#FEF3C7; --dng:#B91C1C; --dngS:#FEE2E2;
          --ink:#0B1220; --inkTx:#E2E8F0; --inkTx2:#94A3B8; --inkBd:#1F2937; --shadow:0 2px 8px rgba(15,23,42,.08);
          --mode:#94A3B8; }
  :root[data-theme="dark"] { --bg:#0B1220; --surf:#111827; --surf2:#0F172A; --bd:#1F2937; --bd2:#334155; --tx:#E2E8F0; --tx2:#94A3B8; --tx3:#64748B;
          --accS:#1E3A8A; --okS:#14532D; --warnS:#78350F; --dngS:#7F1D1D; --ok:#4ADE80; --warn:#FBBF24; --dng:#F87171; --shadow:0 2px 8px rgba(0,0,0,.5); }
  * { box-sizing:border-box }
  html, body { height:100%; overflow:hidden }
  body { margin:0; font:13px/1.45 Inter, -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--tx); -webkit-font-smoothing:antialiased }
  button { font:inherit; color:var(--tx); background:var(--surf); border:1px solid var(--bd2); border-radius:8px; padding:6px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-height:32px }
  button:hover { filter:brightness(.97) } button:disabled { opacity:.5; cursor:default }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:500 }
  button.danger { background:var(--dng); border-color:var(--dng); color:#fff; font-weight:500 }
  button.ghost { background:transparent; border-color:transparent; color:var(--tx2) } button.ghost:hover { background:var(--surf2) }
  button.sm { padding:3px 9px; min-height:26px; font-size:12px }
  .mono { font-family:"JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size:12px }
  svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:500; background:var(--surf2); color:var(--tx2); border:1px solid var(--bd); white-space:nowrap }
  .pill.ok { background:var(--okS); color:var(--ok); border-color:transparent } .pill.warn { background:var(--warnS); color:var(--warn); border-color:transparent }
  .pill.dng { background:var(--dngS); color:var(--dng); border-color:transparent } .pill.acc { background:var(--accS); color:var(--acc); border-color:transparent }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--tx3); display:inline-block } .dot.ok { background:var(--ok) } .dot.warn { background:var(--warn) } .dot.dng { background:var(--dng) } .dot.acc { background:var(--acc) }

  .app { height:100vh; height:100dvh; display:flex; flex-direction:column }
  /* status strip: the coloured top edge is the ONE global "we are on live hardware" signal */
  .strip { height:44px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--surf); border-bottom:1px solid var(--bd); border-top:3px solid var(--mode); overflow:hidden }
  .strip .brand { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; margin-right:6px } .strip .brand img { width:22px; height:22px; border-radius:6px }
  .strip .grow { flex:1 }
  .strip .mem { display:flex; align-items:center; gap:6px; color:var(--tx2); font-size:11px } .strip .mem .bar { width:70px; height:6px; border-radius:3px; background:var(--bd); overflow:hidden } .strip .mem .bar i { display:block; height:100%; background:var(--acc) }
  .strip select { font:inherit; font-size:12px; padding:4px 8px; border-radius:8px; border:1px solid var(--bd2); background:var(--surf); color:var(--tx) }
  .strip .modesel { display:flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--bd2); border-radius:8px; font-size:12px }
  .strip .modesel.plan { border-color:var(--acc); color:var(--acc) } .strip .modesel.auto { border-color:var(--warn); color:var(--warn) }

  .body { flex:1; min-height:0; display:flex }
  /* rail */
  .rail { width:56px; flex-shrink:0; background:var(--surf); border-right:1px solid var(--bd); display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:4px }
  .rail button { width:40px; height:40px; padding:0; justify-content:center; border:0; background:transparent; color:var(--tx2); border-radius:10px } .rail button.active { background:var(--accS); color:var(--acc) } .rail .sp { flex:1 }
  /* panel */
  .panel { width:240px; flex-shrink:0; background:var(--surf); border-right:1px solid var(--bd); display:flex; flex-direction:column; min-height:0 }
  .panel .head { display:flex; justify-content:space-between; align-items:center; padding:12px 12px 8px } .panel h2 { margin:0; font-size:14px; font-weight:600 }
  .panel .search { margin:0 12px 8px; padding:6px 10px; border:1px solid var(--bd); border-radius:8px; font:inherit; background:var(--surf2); color:var(--tx); width:calc(100% - 24px) }
  .panel .list { flex:1; min-height:0; overflow:auto; padding:0 8px 8px }
  .panel .list a { display:block; padding:8px 10px; border-radius:8px; color:inherit; text-decoration:none; border:1px solid transparent }
  .panel .list a:hover { background:var(--surf2) } .panel .list a.active { background:var(--surf2); border-color:var(--bd) }
  .panel .list a .t { display:flex; gap:8px; align-items:flex-start; font-weight:500; line-height:1.3 } .panel .list a .t .dot { margin-top:5px } .panel .list a .s { font-size:11px; color:var(--tx3); margin-left:15px }
  .panel .foot { border-top:1px solid var(--bd); padding:10px 12px; font-size:11px; color:var(--tx2) } .panel .foot .dev { display:flex; align-items:center; gap:8px; padding:4px 0 } .panel .foot b { color:var(--tx); font-weight:500 }
  .panel .devcard { padding:10px 12px; border-bottom:1px solid var(--bd) } .panel .devcard b { font-weight:500 } .panel .devcard .s { font-size:11px; color:var(--tx3) }

  /* chat */
  main { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; background:var(--bg) }
  .chat-head { height:40px; flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--bd); background:var(--surf); overflow:hidden }
  .chat-head .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .chat-head .grow { flex:1 }
  #log { flex:1; min-height:0; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px }
  .msg .who { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--tx2); margin-bottom:4px } .msg .who b { color:var(--tx); font-weight:500 } .msg .who .av { width:22px; height:22px; border-radius:50%; background:var(--surf2); border:1px solid var(--bd); display:inline-flex; align-items:center; justify-content:center; color:var(--tx2) } .msg.user .who .av { background:var(--accS); color:var(--acc) }
  .msg .content { max-width:820px; font-size:14px; word-break:break-word; display:flex; flex-direction:column; gap:8px }
  .user .utext { white-space:pre-wrap; background:var(--surf); border:1px solid var(--bd); border-radius:10px; padding:8px 12px }
  .agent > :first-child { margin-top:0 } .agent > :last-child { margin-bottom:0 }
  .agent p { margin:0 0 .6em } .agent ul, .agent ol { margin:.3em 0 .6em; padding-left:1.4em } .agent li { margin:.15em 0 }
  .agent h1, .agent h2, .agent h3, .agent h4 { margin:.8em 0 .4em; line-height:1.25 } .agent h1 { font-size:1.2em } .agent h2 { font-size:1.1em } .agent h3 { font-size:1.02em }
  .agent code { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; background:var(--surf2); border:1px solid var(--bd); padding:1px 5px; border-radius:4px }
  .agent pre { background:var(--surf2); border:1px solid var(--bd); padding:8px 10px; border-radius:8px; overflow:auto; margin:.4em 0 .7em } .agent pre code { background:none; border:0; padding:0 }
  .agent table { border-collapse:collapse; font-size:13px; background:var(--surf); border-radius:8px; box-shadow:0 0 0 1px var(--bd); overflow:hidden; margin:.4em 0 .8em; display:block; overflow-x:auto; max-width:100% }
  .agent th, .agent td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--bd); vertical-align:top } .agent th { background:var(--surf2); color:var(--tx2); font-weight:600 } .agent tr:last-child td { border-bottom:0 }
  .agent blockquote { margin:.4em 0; padding:2px 12px; border-left:3px solid var(--bd2); color:var(--tx2) } .agent a { color:var(--acc) }
  .err { color:var(--dng); font-size:13px }
  details.reason { font-size:12px; color:var(--tx3) } details.reason summary { cursor:pointer; list-style:none } details.reason pre { white-space:pre-wrap; max-height:200px; overflow:auto; margin:6px 0 0; font:inherit; color:var(--tx2) }
  /* tool block: left bar = action class */
  .tool { border:1px solid var(--bd); border-left:3px solid var(--bd2); border-radius:8px; background:var(--surf); font-size:12px }
  .tool.config { border-left-color:var(--warn) } .tool.actuation { border-left-color:var(--dng) } .tool.read { border-left-color:var(--acc) }
  .tool summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 10px; color:var(--tx2) } .tool summary::-webkit-details-marker { display:none }
  .tool summary b { color:var(--tx); font-weight:500 } .tool summary .brief { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .tool pre { white-space:pre-wrap; margin:0; padding:8px 10px; border-top:1px solid var(--bd); max-height:320px; overflow:auto; background:var(--surf2); color:var(--tx); border-radius:0 0 8px 8px }
  .chip-link { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; background:var(--accS); color:var(--acc); font-size:12px; font-weight:500; cursor:pointer; border:0; width:fit-content }
  /* approval card v2 */
  .perm { border:1px solid var(--bd); border-left:4px solid var(--warn); border-radius:10px; background:var(--surf); box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-direction:column; gap:8px; max-width:820px }
  .perm.actuation { border-left-color:var(--dng) } .perm .cls { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--warn) } .perm.actuation .cls { color:var(--dng) }
  .perm .title { font-weight:600; font-size:14px } .perm .why { color:var(--tx2) }
  .perm pre { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; background:var(--surf2); border:1px solid var(--bd); border-radius:8px; padding:8px 10px; margin:0; white-space:pre-wrap; max-height:260px; overflow:auto }
  .perm .rb { font-size:13px } .perm .rb b { font-weight:600 } .perm .effect { font-size:12px; color:var(--tx2) }
  .perm .actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap } .perm .actions button { min-height:44px; padding:0 16px }
  .hold { position:relative; overflow:hidden } .hold .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.35); transition:width .05s linear } .hold span { position:relative }
  /* question card */
  .q { border:1px solid var(--bd); border-left:4px solid var(--acc); border-radius:10px; background:var(--surf); box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-direction:column; gap:8px; max-width:820px }
  .q .title { font-weight:600; font-size:14px } .q .opts { display:flex; flex-direction:column; gap:6px }
  .q .opt { display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; cursor:pointer } .q .opt span { color:var(--tx2); font-size:12px }
  .q input[type=text] { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--bd); background:var(--surf2); color:var(--tx) } .q .actions { display:flex; gap:8px; justify-content:flex-end }
  #toBottom { position:absolute; right:20px; bottom:96px; z-index:2; border-radius:999px; box-shadow:var(--shadow) }
  /* composer */
  .composer { padding:10px 16px 12px; border-top:1px solid var(--bd); background:var(--surf) }
  .composer form { display:flex; flex-direction:column; gap:6px; border:1px solid var(--bd2); border-radius:12px; padding:8px 10px; background:var(--surf) }
  .composer textarea { font:inherit; font-size:14px; border:0; outline:0; resize:none; min-height:24px; max-height:160px; background:transparent; color:var(--tx) }
  .composer .row { display:flex; align-items:center; gap:6px } .composer .row .grow { flex:1 }
  .composer .row .pill { padding:3px 8px }
  #mic.rec { background:var(--dng); border-color:var(--dng); color:#fff; animation:pulse 1s infinite } @keyframes pulse { 50% { opacity:.6 } }
  #sttStatus, #hint { font-size:12px; color:var(--tx2); padding:2px 4px } #hint a { color:var(--acc) }
  /* dock */
  .dock { width:460px; flex-shrink:0; background:var(--surf); border-left:1px solid var(--bd); display:flex; flex-direction:column; min-height:0 }
  .dock.wide { width:50% }
  .tabs { display:flex; gap:2px; padding:6px 8px; border-bottom:1px solid var(--bd); overflow-x:auto; align-items:center }
  .tabs button { border:0; background:transparent; color:var(--tx2); padding:5px 10px; border-radius:8px; min-height:30px; white-space:nowrap } .tabs button.active { background:var(--surf2); color:var(--tx); font-weight:600 }
  .tabs button.dis { opacity:.45 } .tabs .sp { flex:1 }
  .tabbar { display:flex; gap:6px; padding:8px 10px; border-bottom:1px solid var(--bd); align-items:center; flex-wrap:wrap } .tabbar .grow { flex:1 }
  .tabbody { flex:1; min-height:0; overflow:auto; padding:10px }
  /* traces */
  .trace { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; border-left:3px solid var(--bd2); margin-bottom:4px; background:var(--surf2); font-size:12px; cursor:pointer }
  .trace.config { border-left-color:var(--warn) } .trace.actuation { border-left-color:var(--dng) } .trace.read { border-left-color:var(--acc) }
  .trace b { font-weight:500 } .trace .brief { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--tx2) } .trace .t { color:var(--tx3) }
  /* console */
  .con { background:var(--ink); color:var(--inkTx); border-radius:10px; padding:8px; min-height:100%; font-family:"JetBrains Mono", Menlo, monospace; font-size:12px }
  .con .blk { border-top:1px solid var(--inkBd); padding:8px 6px } .con .blk:first-child { border-top:0 }
  .con .hd { display:flex; gap:8px; align-items:center; color:var(--inkTx2); margin-bottom:4px; font-family:Inter, system-ui, sans-serif } .con .hd .pill { background:var(--inkBd); border-color:transparent; color:var(--inkTx) }
  .con .hd .pill.config { background:#78350F; color:#FDE68A } .con .hd .pill.actuation { background:#7F1D1D; color:#FECACA } .con .hd .pill.read { background:#1E3A8A; color:#BFDBFE } .con .hd .grow { flex:1 }
  .con .cmd { color:#fff } .con pre { margin:4px 0 0; white-space:pre-wrap; color:var(--inkTx); max-height:260px; overflow:auto }
  .con-in { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--bd); align-items:center } .con-in input { flex:1; font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; padding:7px 10px; border:1px solid var(--bd2); border-radius:8px; background:var(--surf2); color:var(--tx) }
  .con-note { font-size:11px; color:var(--tx3); padding:0 10px 8px }
  /* device */
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px }
  .card { border:1px solid var(--bd); border-radius:10px; padding:10px 12px; background:var(--surf) } .card.warn { border-color:var(--warn) } .card.dng { border-color:var(--dng) }
  .card .ch { display:flex; align-items:center; gap:6px; font-weight:600; margin-bottom:6px } .card .ch .grow { flex:1 }
  .card .kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:2px 0 } .card .kv span:last-child { font-family:"JetBrains Mono", Menlo, monospace; color:var(--tx2); text-align:right; white-space:pre-wrap; word-break:break-all }
  .card pre { margin:0; font-family:"JetBrains Mono", Menlo, monospace; font-size:11px; white-space:pre-wrap; color:var(--tx2); max-height:200px; overflow:auto }
  .devhead { display:flex; align-items:center; gap:10px; margin-bottom:10px } .devhead .n { font-weight:600; font-size:15px } .devhead .s { color:var(--tx2); font-size:12px }
  .topo { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding:6px 0 } .topo .node { border:1px solid var(--bd); border-radius:10px; padding:8px 10px; min-width:130px; background:var(--surf); cursor:pointer } .topo .node.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) }
  .topo .node .n { font-weight:600; display:flex; align-items:center; gap:6px } .topo .node .s { font-size:11px; color:var(--tx3); font-family:"JetBrains Mono", Menlo, monospace }
  .topo .edge { width:36px; display:flex; align-items:center; justify-content:center; color:var(--tx3); font-size:10px; position:relative } .topo .edge::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--bd2) } .topo .edge span { background:var(--surf); position:relative; padding:0 2px }
  /* diagram */
  .dia { background:var(--surf2); border:1px solid var(--bd); border-radius:10px; padding:10px; min-height:200px; overflow:auto } .dia svg { max-width:100% }
  .dia-src { width:100%; min-height:140px; font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; border:1px solid var(--bd2); border-radius:8px; padding:8px; background:var(--surf); color:var(--tx); resize:vertical }
  .legend { display:flex; gap:12px; font-size:11px; color:var(--tx2); flex-wrap:wrap; padding:6px 0 }
  .empty { color:var(--tx3); font-size:12px; padding:20px; text-align:center }
  /* audit view */
  #auditView table { border-collapse:collapse; width:100%; font-size:12px; background:var(--surf); border-radius:10px; box-shadow:0 0 0 1px var(--bd); overflow:hidden }
  #auditView th, #auditView td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--bd); vertical-align:top } #auditView th { background:var(--surf2); color:var(--tx2); font-weight:600 }
  #auditView td.c { font-family:"JetBrains Mono", Menlo, monospace; white-space:pre-wrap; word-break:break-all } .rej { color:var(--dng) }
  .view { flex:1; min-height:0; overflow:auto; padding:16px 20px }
  /* library */
  .libhit { border:1px solid var(--bd); border-radius:10px; background:var(--surf); padding:8px 10px; margin-bottom:8px; font-size:12.5px }
  .libhit .h { display:flex; gap:6px; align-items:center; font-weight:600; margin-bottom:4px } .libhit .h .grow { flex:1 } .libhit .h .src { font-family:"JetBrains Mono", Menlo, monospace; font-size:11px; color:var(--acc) }
  .libhit .sn { color:var(--tx2); white-space:pre-wrap; max-height:9.5em; overflow:hidden } .libhit .acts { display:flex; gap:4px; margin-top:6px }
  .libhit mark, .libread mark { background:var(--accS); color:var(--tx); padding:0 2px; border-radius:2px }
  .libread { white-space:pre-wrap; font-size:12.5px; line-height:1.5 }
  .libdoc { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--bd); font-size:12.5px } .libdoc .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .tabbar input.q, .tabbar select { font:inherit; font-size:12px; padding:5px 8px; border:1px solid var(--bd2); border-radius:8px; background:var(--surf2); color:var(--tx) }
  /* media + attachments */
  .mgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px }
  .mthumb { position:relative; border:1px solid var(--bd); border-radius:8px; overflow:hidden; aspect-ratio:4/3; background:var(--surf2); cursor:pointer }
  .mthumb img { width:100%; height:100%; object-fit:cover; display:block } .mthumb.sel { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) }
  .mthumb .ov { position:absolute; left:4px; right:4px; bottom:4px; display:flex; gap:4px; justify-content:space-between }
  .mthumb .ov button { min-height:24px; padding:0 7px; font-size:11px }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px } .thumbs img { width:120px; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--bd); display:block }
  #attachRow { display:flex; flex-wrap:wrap; gap:6px } #attachRow:empty { display:none }
  #attachRow .att { position:relative } #attachRow img { width:56px; height:42px; object-fit:cover; border-radius:6px; border:1px solid var(--bd2); display:block }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
marked.use({ gfm: true, breaks: true });
// Markdown from the model: raw HTML is shown as text, links only http(s)/mailto, images become links
marked.use({ renderer: {
  html(t) { return esc(t.text ?? t); },
  link(t) { const h = /^(https?:|mailto:)/i.test(t.href) ? t.href : "#"; return `<a href="${esc(h).replace(/"/g, "&quot;")}" target="_blank" rel="noopener noreferrer">${this.parser.parseInline(t.tokens)}</a>`; },
  image(t) { const h = /^https?:/i.test(t.href) ? t.href : "#"; return `<a href="${esc(h).replace(/"/g, "&quot;")}" target="_blank" rel="noopener noreferrer">${esc(t.text || t.href)}</a>`; } } });

// ---------- action classes (mirror of support_ui.py / target_host.py) ----------

// ---------- global state ----------
let sid = location.hash.slice(1) || null, lastHTML = "", lastData = null, busySince = null, stateCache = null, targetName = "";
// Skins (static/terran.css): Terran (default) / Zerg, switched by the #theme button; colours stay dark only
const SKINS = ["terran", "zerg"];

  document.documentElement.dataset.skin = k;

  const b = document.getElementById("theme");

    if (k === "zerg") l.removeAttribute("type");

applySkin(document.documentElement.dataset.skin || "terran");
document.getElementById("theme").onclick = () => applySkin(SKINS[(SKINS.indexOf(document.documentElement.dataset.skin) + 1) % SKINS.length]);

// ---------- approval mode (graduated autonomy as a UI element, not a setting) ----------

// ---------- state / strip / panel ----------

  if (!window.isSecureContext && f.tls && !isLocal) {
    $("#hint").innerHTML = `Микрофон и установка как приложения работают только по HTTPS: <a href="https://${location.hostname}:${f.tls_port}/">https://${location.hostname}:${f.tls_port}/</a> — один раз установите сертификат <a href="/ca.crt">ca.crt</a> на этом устройстве.`;
    $("#hint").style.display = ""; return;
  }
  if (!f.stt || !window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return;
  stt.model = f.stt_model; $("#mic").style.display = "";
}
function ensureWorker() {
  if (stt.worker) return;
  stt.worker = new Worker("/static/stt-worker.js", { type: "module" });
  stt.worker.onmessage = ({ data }) => {
    if (data.type === "progress" && data.status === "progress") setStt(`загрузка модели распознавания: ${data.file?.split("/").pop()} ${Math.round(data.progress || 0)}%`);
    if (data.type === "ready") { stt.ready = true; stt.loading = false; setStt(`распознавание готово (${data.device === "webgpu" ? "GPU" : "CPU"})`); setTimeout(() => setStt(""), 2500); if (stt.pendingAudio) { transcribe(stt.pendingAudio); stt.pendingAudio = null; } }
    if (data.type === "result") { setStt(""); const t = $("#input"); t.value = (t.value ? t.value.replace(/\s*$/, " ") : "") + data.text; t.focus(); }
    if (data.type === "error") { stt.loading = false; setStt("ошибка распознавания: " + data.message); }
  };
  stt.worker.onerror = e => setStt("ошибка модуля распознавания: " + (e.message || "см. консоль"));
  stt.loading = true; setStt("загрузка модели распознавания…");
  stt.worker.postMessage({ type: "load", model: stt.model });
}
function transcribe(audio) {
  if (!stt.ready) { stt.pendingAudio = audio; ensureWorker(); return; }
  setStt(`распознаю (${(audio.length / 16000).toFixed(1)} с)…`);
  stt.worker.postMessage({ type: "transcribe", audio, language: "russian" }, [audio.buffer]);
}
async function startRec() {
  ensureWorker();
  try { stt.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { setStt("нет доступа к микрофону: " + e.message); return; }
  stt.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const src = stt.ctx.createMediaStreamSource(stt.stream);
  stt.node = stt.ctx.createScriptProcessor(4096, 1, 1); stt.chunks = [];
  stt.node.onaudioprocess = e => { if (stt.recording) stt.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(stt.node); stt.node.connect(stt.ctx.destination);
  stt.recording = true; $("#mic").classList.add("rec"); setStt("слушаю… нажми ещё раз, чтобы закончить");
}
async function stopRec() {
  stt.recording = false; $("#mic").classList.remove("rec");
  stt.node?.disconnect(); stt.stream?.getTracks().forEach(t => t.stop()); await stt.ctx?.close();
  const n = stt.chunks.reduce((a, c) => a + c.length, 0);
  if (stt.ctx && stt.ctx.sampleRate !== 16000) { setStt("браузер не дал 16 кГц, повтори"); return; }
  if (n < 16000 * 0.5) { setStt("слишком коротко"); return; }
  const audio = new Float32Array(n); let o = 0; for (const c of stt.chunks) { audio.set(c, o); o += c.length; }
  stt.chunks = []; transcribe(audio);
}
$("#mic").onclick = () => stt.recording ? stopRec() : startRec();
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !["INPUT","TEXTAREA","BUTTON","SELECT"].includes(document.activeElement?.tagName) && $("#mic").style.display !== "none" && !e.repeat) { e.preventDefault(); $("#mic").click(); }
});
const sttTest = new URLSearchParams(location.search).get("stt_test");
initVoice().then(async () => {
  if (!sttTest) return;
  const f = await api("/api/features"); stt.model = f.stt_model;
  const buf = await (await fetch(sttTest)).arrayBuffer();
  const ctx = new OfflineAudioContext(1, 16000 * 60, 16000);
  const dec = await ctx.decodeAudioData(buf);
  transcribe(new Float32Array(dec.getChannelData(0).subarray(0, Math.ceil(dec.duration * 16000))));
});
</script>
