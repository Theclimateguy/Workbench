<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Support</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="/static/lib/marked.umd.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb;
          --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --tool:#f3f4f6; --user:#e8f0fe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa3ad; --line:#2a2f3a; --accent:#60a5fa;
            --tool:#1f2430; --user:#1e2a44; }
  }
  * { box-sizing:border-box } html, body { height:100%; overflow:hidden } body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink) }
  .app { display:grid; grid-template-columns: 280px 1fr; height:100vh; height:100dvh }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:14px; overflow:auto; display:flex; flex-direction:column; gap:14px }
  main { display:flex; flex-direction:column; min-width:0; min-height:0 }   /* min-height:0 — otherwise #log grows past the viewport instead of scrolling */
  h1 { font-size:16px; margin:0 } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 6px }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:var(--tool) }
  .pill.ok { color:var(--ok) } .pill.bad { color:var(--bad) } .pill.warn { color:var(--warn) }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent) }
  button.danger { color:var(--bad) } button:disabled { opacity:.5; cursor:default }
  .sessions a { display:block; padding:6px 8px; border-radius:6px; color:inherit; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .sessions a.active, .sessions a:hover { background:var(--tool) }
  #log { flex:1; min-height:0; overflow-y:auto; padding:18px 24px; display:flex; flex-direction:column; gap:12px }
  .msg { max-width: 920px } .msg.user .bubble { background:var(--user) }
  .bubble { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; word-break:break-word; overflow-x:auto }
  .bubble > :first-child { margin-top:0 } .bubble > :last-child { margin-bottom:0 }
  .bubble p { margin:0 0 .6em } .bubble ul, .bubble ol { margin:.3em 0 .6em; padding-left:1.4em } .bubble li { margin:.15em 0 }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin:.8em 0 .4em; line-height:1.25 } .bubble h1 { font-size:1.25em } .bubble h2 { font-size:1.15em } .bubble h3 { font-size:1.05em }
  .bubble code { background:var(--tool); padding:1px 5px; border-radius:4px; font-size:.92em }
  .bubble pre { background:var(--tool); padding:8px 10px; border-radius:6px; overflow:auto; margin:.4em 0 .7em } .bubble pre code { background:none; padding:0; font-size:12.5px }
  .bubble table { border-collapse:collapse; margin:.4em 0 .8em; font-size:13.5px; display:block; overflow-x:auto; max-width:100% }
  .bubble th, .bubble td { border:1px solid var(--line); padding:4px 9px; text-align:left; vertical-align:top } .bubble th { background:var(--tool); font-weight:600 }
  .bubble tr:nth-child(even) td { background:color-mix(in srgb, var(--tool) 50%, transparent) }
  .bubble blockquote { margin:.4em 0; padding:2px 12px; border-left:3px solid var(--line); color:var(--muted) }
  .bubble hr { border:0; border-top:1px solid var(--line); margin:.8em 0 } .bubble a { color:var(--accent) }
  #toBottom { position:absolute; right:28px; bottom:96px; z-index:2; border-radius:999px; padding:6px 12px; box-shadow:0 2px 8px rgba(0,0,0,.25); background:var(--panel) }
  main { position:relative }
  .meta { font-size:12px; color:var(--muted); margin:0 0 4px }
  details.tool { background:var(--tool); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px }
  details.tool summary { cursor:pointer } details.tool pre { white-space:pre-wrap; margin:6px 0 0; max-height:320px; overflow:auto; font-size:12px }
  details.reason { font-size:13px; color:var(--muted) } details.reason pre { white-space:pre-wrap; max-height:200px; overflow:auto }
  .perm { border:2px solid var(--warn); background:var(--panel); border-radius:12px; padding:12px 14px; max-width:920px }
  .perm pre { background:var(--tool); padding:8px; border-radius:6px; white-space:pre-wrap; max-height:260px; overflow:auto; font-size:13px }
  .perm .actions { display:flex; gap:8px; margin-top:8px }
  form { display:flex; gap:8px; padding:12px 24px; border-top:1px solid var(--line); background:var(--panel) }
  textarea { flex:1; font:inherit; resize:vertical; min-height:44px; max-height:200px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink) }
  .audit { font-size:12px; color:var(--muted) } .audit div { padding:2px 0; border-bottom:1px dashed var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .err { color:var(--bad); font-size:13px }
  .topbar { display:flex; gap:10px; align-items:center; padding:10px 24px; border-bottom:1px solid var(--line); background:var(--panel) }
  .spacer { flex:1 }
  #mic { min-width:44px; font-size:18px; line-height:1 } #mic.rec { background:var(--bad); color:#fff; border-color:var(--bad); animation: pulse 1s infinite }
  @keyframes pulse { 50% { opacity:.6 } }
  #sttStatus { font-size:12px; color:var(--muted); padding:0 24px 6px; background:var(--panel) }
  #hint { font-size:12px; color:var(--muted); padding:4px 24px; background:var(--panel); border-top:1px solid var(--line) } #hint a { color:var(--accent) }
  @media (max-width: 860px) { .app { grid-template-columns: 1fr } aside { display:none } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Spark Support</h1>
    <div><h2>LLM</h2><div id="llm"></div></div>
    <div><h2>Цели</h2><div id="targets" class="audit"></div></div>
    <div><h2>Документация</h2><div id="docs" class="audit"></div></div>
    <div>
      <h2>Сессии <button id="newSession" style="float:right;padding:2px 8px">+ новая</button></h2>
      <div id="sessions" class="sessions"></div>
    </div>
    <div><h2>Аудит (последние)</h2><div id="audit" class="audit"></div></div>
  </aside>
  <main>
    <div class="topbar">
      <span id="title">Выбери или создай сессию</span>
      <span class="spacer"></span>
      <span id="busy" class="pill" style="display:none">думает…</span>
      <button id="abort" class="danger" style="display:none">Стоп</button>
      <button id="installPwa" style="display:none" title="Установить как приложение на этот компьютер">⤓ Установить</button>
    </div>
    <div id="log"></div>
    <button id="toBottom" type="button" style="display:none" title="К последним сообщениям">↓ вниз</button>
    <div id="hint" style="display:none"></div>
    <div id="sttStatus" style="display:none"></div>
    <form id="form">
      <button type="button" id="mic" style="display:none" title="Голосовой ввод: нажми — говори — нажми ещё раз (или пробел, когда курсор не в поле)">🎤</button>
      <textarea id="input" placeholder="Опиши проблему или задачу для workstation… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button class="primary" id="send" type="submit">Отправить</button>
    </form>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
let sid = location.hash.slice(1) || null, pollTimer = null, lastJSON = "";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// Markdown (GFM: tables, lists, code) via marked; raw HTML is neutralised by escaping before parsing.
marked.use({ gfm: true, breaks: true });
const fmt = s => { try { return marked.parse(esc(s)); } catch { return esc(s).replace(/\n/g, "<br>"); } };
const api = async (path, opt={}) => {
  const r = await fetch(location.origin + path, {headers:{"Content-Type":"application/json"}, ...opt});
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
};

async function refreshState() {
  try {
    const s = await api("/api/state");
    $("#llm").innerHTML = s.llm.up
      ? `<span class="pill ok">online</span> ${esc(s.llm.models.join(", "))}<br><span class="audit">fast: ${s.profiles.fast} · deep: ${s.profiles.deep}</span>`
      : `<span class="pill bad">offline</span> <span class="audit">fast: ${s.profiles.fast} · deep: ${s.profiles.deep}</span>`;
    $("#targets").innerHTML = s.targets.length ? s.targets.map(t => `<div><b>${esc(t.name)}</b> ${esc(t.user)}@${esc(t.host)}:${esc(t.port)}</div>`).join("")
                                               : "<div>нет — <code>support-ctl target add ws user@host</code></div>";
    $("#docs").innerHTML = `<div>${s.docs.files} файлов, ~${s.docs.tokens_est.toLocaleString("ru")} токенов</div>`;
    $("#sessions").innerHTML = s.sessions.map(x => `<a href="#${x.id}" class="${x.id===sid?"active":""}">${esc(x.title || x.id)}</a>`).join("");
    if (!sid && s.sessions.length) { location.hash = s.sessions[0].id; }
    const a = await api("/api/audit?n=12");
    $("#audit").innerHTML = a.map(e => `<div title="${esc(JSON.stringify(e))}">${esc((e.ts||"").slice(11,19))} ${esc(e.tool)} ${esc(e.cmd||e.path||"")} ${e.rejected?"⛔":""} ${e.rc!=null?"rc="+e.rc:""}</div>`).join("");
  } catch (e) { $("#llm").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function renderPerm(p, calls) {
  const call = calls[p.tool?.callID] || {};
  const i = Object.keys(p.metadata?.input || {}).length ? p.metadata.input : (call.input || p.metadata || {});
  const tool = call.tool || p.metadata?.tool || p.permission || "";
  const fields = ["target","cmd","path","reason","mode","wait_seconds"].filter(k => i[k] !== undefined).map(k => `${k}: ${i[k]}`).join("\n");
  const content = i.content !== undefined ? `\n--- content ---\n${i.content}` : "";
  return `<div class="perm" data-pid="${p.id}">
    <div><b>Требуется подтверждение:</b> <code>${esc(tool)}</code></div>
    <pre>${esc(fields + content) || esc(JSON.stringify(i, null, 1))}</pre>
    <div class="actions">
      <button class="primary" data-resp="once">Разрешить</button>
      <button data-resp="always">Разрешить и не спрашивать</button>
      <button class="danger" data-resp="reject">Отклонить</button>
    </div></div>`;
}

function renderMessages(d) {
  const calls = {};
  d.messages.forEach(m => m.parts.forEach(p => { if (p.type === "tool" && p.callID) calls[p.callID] = p; }));
  const html = d.messages.map(m => {
    const parts = m.parts.map(p => {
      if (p.type === "text") return `<div class="bubble">${fmt(p.text)}</div>`;
      if (p.type === "reasoning") return `<details class="reason"><summary>рассуждение</summary><pre>${esc(p.text)}</pre></details>`;
      if (p.type === "tool") {
        const icon = {completed:"✓", error:"✗", running:"…", pending:"…"}[p.status] || "·";
        const inp = Object.entries(p.input||{}).map(([k,v]) => `${k}=${typeof v==="string"?v:JSON.stringify(v)}`).join("  ");
        return `<details class="tool"><summary>${icon} <b>${esc(p.tool)}</b> ${esc(inp).slice(0,160)}</summary><pre>${esc(p.output)}</pre></details>`;
      }
      return "";
    }).join("");
    const err = m.error ? `<div class="err">Ошибка: ${esc(m.error)}</div>` : "";
    return `<div class="msg ${m.role}"><div class="meta">${m.role==="user"?"Ты":"Агент"} · ${m.time?new Date(m.time).toLocaleTimeString("ru"):""}</div>${parts}${err}</div>`;
  }).join("") + d.pending.map(p => renderPerm(p, calls)).join("");
  if (html !== lastJSON) {
    $("#log").innerHTML = html; lastJSON = html;
    if (stickBottom) scrollToBottom();          // new agent output: follow it unless the operator scrolled up to read
  }
  $("#busy").style.display = d.busy ? "" : "none";
  $("#abort").style.display = d.busy ? "" : "none";
  $("#send").disabled = !sid;
}

// Auto-scroll: stick to the bottom while new messages arrive; scrolling up pauses it (button "↓ вниз" resumes).
let stickBottom = true;
const log = $("#log");
const scrollToBottom = () => { log.scrollTop = log.scrollHeight; stickBottom = true; $("#toBottom").style.display = "none"; };
log.addEventListener("scroll", () => {
  const nearBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
  stickBottom = nearBottom; $("#toBottom").style.display = nearBottom ? "none" : "";
});
$("#toBottom").onclick = scrollToBottom;

async function poll() {
  if (!sid) return;
  try { renderMessages(await api(`/api/session/${sid}`)); }
  catch (e) { $("#log").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function selectSession(id) {
  sid = id; lastJSON = ""; stickBottom = true; $("#title").textContent = id ? `Сессия ${id.slice(-6)}` : "Выбери или создай сессию";
  document.querySelectorAll(".sessions a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#"+id));
  poll();
}

window.addEventListener("hashchange", () => selectSession(location.hash.slice(1)));
$("#newSession").onclick = async () => { const s = await api("/api/session", {method:"POST", body: JSON.stringify({title: "Сессия " + new Date().toLocaleString("ru")})}); await refreshState(); location.hash = s.id; };
$("#form").onsubmit = async e => {
  e.preventDefault(); const text = $("#input").value.trim(); if (!text || !sid) return;
  $("#input").value = ""; stickBottom = true; await api(`/api/session/${sid}/prompt`, {method:"POST", body: JSON.stringify({text})}); poll();
};
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#abort").onclick = () => api(`/api/session/${sid}/abort`, {method:"POST"});
$("#log").addEventListener("click", async e => {
  const b = e.target.closest("button[data-resp]"); if (!b) return;
  const pid = b.closest(".perm").dataset.pid; b.disabled = true;
  await api(`/api/session/${sid}/permission/${pid}`, {method:"POST", body: JSON.stringify({response: b.dataset.resp})}); poll();
});

refreshState(); if (sid) selectSession(sid);
setInterval(poll, 1500); setInterval(refreshState, 10000);

// ---------- PWA ----------
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/static/sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installPwa").style.display = ""; });
$("#installPwa").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#installPwa").style.display = "none"; };
window.addEventListener("appinstalled", () => { $("#installPwa").style.display = "none"; });

// ---------- Offline voice input (browser-side Whisper; text lands in the input box, operator sends it) ----------
const stt = { worker: null, ready: false, loading: false, recording: false, ctx: null, stream: null, node: null, chunks: [], model: null };
const setStt = (t, show=true) => { $("#sttStatus").textContent = t; $("#sttStatus").style.display = show && t ? "" : "none"; };
async function initVoice() {
  let f; try { f = await api("/api/features"); } catch { return; }
  const isLocal = ["localhost","127.0.0.1"].includes(location.hostname);
  if (!window.isSecureContext && f.tls && !isLocal) {
    $("#hint").innerHTML = `Микрофон и установка как приложения работают только по HTTPS: <a href="https://${location.hostname}:${f.tls_port}/">https://${location.hostname}:${f.tls_port}/</a> — один раз установите сертификат <a href="/ca.crt">ca.crt</a> на этом устройстве.`;
    $("#hint").style.display = ""; return;
  }
  if (!f.stt || !window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return;
  stt.model = f.stt_model; $("#mic").style.display = "";
}
function ensureWorker() {
  if (stt.worker) return;
  stt.worker = new Worker("/static/stt-worker.js", { type: "module" });
  stt.worker.onmessage = ({ data }) => {
    if (data.type === "progress" && data.status === "progress") setStt(`загрузка модели распознавания: ${data.file?.split("/").pop()} ${Math.round(data.progress || 0)}%`);
    if (data.type === "ready") { stt.ready = true; stt.loading = false; setStt(`распознавание готово (${data.device === "webgpu" ? "GPU" : "CPU"})`); setTimeout(() => setStt(""), 2500); if (stt.pendingAudio) { transcribe(stt.pendingAudio); stt.pendingAudio = null; } }
    if (data.type === "result") { setStt(""); const t = $("#input"); t.value = (t.value ? t.value.replace(/\s*$/, " ") : "") + data.text; t.focus(); t.dispatchEvent(new Event("input")); }
    if (data.type === "error") { stt.loading = false; setStt("ошибка распознавания: " + data.message); }
  };
  stt.loading = true; setStt("загрузка модели распознавания…");
  stt.worker.postMessage({ type: "load", model: stt.model });
}
function transcribe(audio) {
  if (!stt.ready) { stt.pendingAudio = audio; ensureWorker(); return; }
  setStt(`распознаю (${(audio.length / 16000).toFixed(1)} с)…`);
  stt.worker.postMessage({ type: "transcribe", audio, language: "russian" }, [audio.buffer]);
}
async function startRec() {
  ensureWorker();
  try { stt.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { setStt("нет доступа к микрофону: " + e.message); return; }
  stt.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const src = stt.ctx.createMediaStreamSource(stt.stream);
  stt.node = stt.ctx.createScriptProcessor(4096, 1, 1); stt.chunks = [];
  stt.node.onaudioprocess = e => { if (stt.recording) stt.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(stt.node); stt.node.connect(stt.ctx.destination);
  stt.recording = true; $("#mic").classList.add("rec"); setStt("слушаю… нажми ещё раз, чтобы закончить");
}
async function stopRec() {
  stt.recording = false; $("#mic").classList.remove("rec");
  stt.node?.disconnect(); stt.stream?.getTracks().forEach(t => t.stop()); await stt.ctx?.close();
  const n = stt.chunks.reduce((a, c) => a + c.length, 0);
  if (stt.ctx && stt.ctx.sampleRate !== 16000) { setStt("браузер не дал 16 кГц, повтори"); return; }
  if (n < 16000 * 0.5) { setStt("слишком коротко"); return; }
  const audio = new Float32Array(n); let o = 0; for (const c of stt.chunks) { audio.set(c, o); o += c.length; }
  stt.chunks = []; transcribe(audio);
}
$("#mic").onclick = () => stt.recording ? stopRec() : startRec();
document.addEventListener("keydown", e => {
  if (e.code === "Space" && document.activeElement !== $("#input") && $("#mic").style.display !== "none" && !e.repeat) { e.preventDefault(); $("#mic").click(); }
});
// Self-test without a microphone: ?stt_test=/static/test.wav transcribes that file into the input box.
const sttTest = new URLSearchParams(location.search).get("stt_test");
initVoice().then(async () => {
  if (!sttTest) return;
  const f = await api("/api/features"); stt.model = f.stt_model;
  const buf = await (await fetch(sttTest)).arrayBuffer();
  const ctx = new OfflineAudioContext(1, 16000 * 60, 16000);
  const dec = await ctx.decodeAudioData(buf);
  transcribe(new Float32Array(dec.getChannelData(0).subarray(0, Math.ceil(dec.duration * 16000))));
});
</script>
</body>
</html>
